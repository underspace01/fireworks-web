<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>花火操作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="tap-area">
    <p id="status" aria-live="polite">接続中…</p>
    <p id="hint">画面をタップしてランダム打上</p>
    <button id="settings-button" type="button" aria-label="花火の設定を開く">⚙</button>
    <section id="settings-panel" aria-label="花火の設定">
      <button id="close-button" type="button" aria-label="設定を閉じる">×</button>
      <h1>花火の設定</h1>
      <label>サイズ<select id="size"></select></label>
      <label>構造<select id="structure"></select></label>
      <label>基本色<select id="color"></select></label>
      <label id="change-color-row">変化色<select id="change-color"></select></label>
      <label id="text-firework-row">文字花火（最大6文字）<input id="text-firework" type="text" maxlength="6" autocomplete="off"></label>
      <button id="launch-button" type="button">指定して打上</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
